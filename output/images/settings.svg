<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="480" height="320" fill="#ffffff"/>

  <text x="24" y="26" font-size="17" font-weight="bold" fill="#333">系统设置</text>

  <!-- 选中项 -->
  <rect x="20" y="45" width="150" height="34" rx="6" fill="#3a3a3c"/>
  <text x="36" y="67" font-size="15" fill="#fff">修改密码</text>
  <polygon points="176,55 176,69 184,62" fill="#555"/>

  <rect x="20" y="87" width="150" height="34" rx="6" fill="#fff"/>
  <text x="36" y="109" font-size="15" fill="#333">校准传感器</text>

  <rect x="20" y="129" width="150" height="34" rx="6" fill="#fff"/>
  <text x="36" y="151" font-size="15" fill="#333">设置参数</text>

  <rect x="20" y="171" width="150" height="34" rx="6" fill="#fff"/>
  <text x="36" y="193" font-size="15" fill="#333">恢复出厂</text>

  <!-- 底部按钮 -->
  <rect x="15" y="270" width="138" height="40" rx="6" fill="#3a3a3c"/>
  <text x="84" y="295" text-anchor="middle" font-size="14" fill="#fff">返回主页</text>
  <rect x="171" y="270" width="138" height="40" rx="6" fill="#3a3a3c"/>
  <text x="240" y="295" text-anchor="middle" font-size="14" fill="#fff">下一选项</text>
  <rect x="327" y="270" width="138" height="40" rx="6" fill="#3a3a3c"/>
  <text x="396" y="295" text-anchor="middle" font-size="14" fill="#fff">确认</text>
</svg>