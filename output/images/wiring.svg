<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="860" height="430" fill="#f5f6f8"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">系统接线示意图</text>

  <!-- 传感器（左） -->
  <rect x="20" y="55" width="210" height="220" rx="10" fill="#eef3fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="125" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">输入 · 传感器</text>
  <rect x="40" y="95" width="170" height="46" rx="6" fill="#fff" stroke="#888"/>
  <text x="125" y="114" text-anchor="middle" font-size="13">温度传感器 PT100</text>
  <text x="125" y="132" text-anchor="middle" font-size="12" fill="#666">→ PC5 / ADC15</text>
  <rect x="40" y="150" width="170" height="46" rx="6" fill="#fff" stroke="#888"/>
  <text x="125" y="169" text-anchor="middle" font-size="13">压力变送器（柜压）</text>
  <text x="125" y="187" text-anchor="middle" font-size="12" fill="#666">→ PC4 / ADC14</text>
  <rect x="40" y="205" width="170" height="46" rx="6" fill="#fff" stroke="#888"/>
  <text x="125" y="224" text-anchor="middle" font-size="13">风压变送器（备）</text>
  <text x="125" y="242" text-anchor="middle" font-size="12" fill="#666">→ PC2 / ADC12</text>

  <!-- 主控（中） -->
  <rect x="310" y="55" width="240" height="220" rx="10" fill="#eafaf1" stroke="#2f855a" stroke-width="1.5"/>
  <text x="430" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f855a">主控单元</text>
  <rect x="335" y="95" width="190" height="44" rx="6" fill="#2f855a"/>
  <text x="430" y="122" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">GD32F103RCT6</text>
  <text x="430" y="160" text-anchor="middle" font-size="12" fill="#333">3.5寸 480×320 显示屏</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#333">按键 ×3（KEY1/2/3）</text>
  <text x="430" y="204" text-anchor="middle" font-size="12" fill="#333">蜂鸣器 · Flash 参数存储</text>
  <text x="430" y="250" text-anchor="middle" font-size="12" fill="#666">正压稳压 + 欠压断电 + 流失流量监测</text>

  <!-- 继电器（右） -->
  <rect x="630" y="55" width="210" height="220" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="735" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">输出 · 继电器</text>
  <rect x="650" y="95" width="170" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="735" y="120" text-anchor="middle" font-size="13">排气 → PD2</text>
  <rect x="650" y="142" width="170" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="735" y="167" text-anchor="middle" font-size="13">进气 → PC0</text>
  <rect x="650" y="189" width="170" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="735" y="214" text-anchor="middle" font-size="13">警报 → PC12</text>
  <rect x="650" y="236" width="170" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="735" y="261" text-anchor="middle" font-size="13">送电 → PC1</text>

  <!-- 连线箭头 -->
  <line x1="230" y1="165" x2="310" y2="165" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="550" y1="165" x2="630" y2="165" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <!-- 底部说明 -->
  <rect x="20" y="320" width="820" height="90" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="40" y="348" font-size="13" font-weight="bold" fill="#333">运行原理</text>
  <text x="40" y="372" font-size="12.5" fill="#444">1. 传感器实时采集柜内压力、温度，主控按设定区间控制进/排气继电器维持柜内正压；</text>
  <text x="40" y="393" font-size="12.5" fill="#444">2. 压力低于下限持续 10s 自动切断送电（欠压保护）；温度超限或压力超限触发声光报警；</text>
  <text x="40" y="414" font-size="12.5" fill="#444">3. 进/排气都关闭的空闲时段，自动按压力衰减法每 30s 测算柜体流失流量（L/h）。</text>
</svg>